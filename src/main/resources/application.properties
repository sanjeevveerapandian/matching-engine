spring.application.name=matching-engine

# --- Strict JSON: money and quantities must not be guessed at ----------------------------------
# a misspelt field ("quantitty") is an error, not silently ignored
spring.jackson.deserialization.fail-on-unknown-properties=true
# 10.5 or 10.0 is refused for a whole-number field (Jackson would otherwise truncate it to 10)
spring.jackson.deserialization.accept-float-as-int=false
# "10" is refused for a number field. (The price must be a JSON string: that is enforced by
# StrictStringDeserializer, because this setting does not stop a NUMBER being read as text.)
spring.jackson.mapper.allow-coercion-of-scalars=false
# "buy" and "BUY" both work
spring.jackson.mapper.accept-case-insensitive-enums=true

# --- Shutdown: let requests that are waiting on the engine thread finish first -----------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# --- The exchange --------------------------------------------------------------------------------
# each run creates its own sub-folder here with commands.log and snapshots/
matching.data-dir=data
matching.snapshot-every=10000
matching.queue-capacity=1024
matching.request-timeout=5s
matching.recent-trades=1000
# live feed: at most one book update per 100 ms, 10 levels per side
matching.book-publish-interval=100ms
matching.book-depth=10
matching.trade-feed-capacity=10000

# --- Hosting -------------------------------------------------------------------------------------
# Hosting platforms (Render, Railway, ...) tell the app which port to use in the PORT variable.
# Without it (running locally) the port is 8080.
server.port=${PORT:8080}
# Behind a platform's HTTPS proxy the browser's address is https://<public host>, but the request reaches
# us as plain http. Honour the proxy's X-Forwarded-Host/-Proto headers, so the WebSocket's same-origin
# check compares the page's real address (a page from another website is still refused).
server.forward-headers-strategy=framework

# --- Health check --------------------------------------------------------------------------------
# GET /actuator/health is the only actuator endpoint that is public, and it shows only UP or DOWN.
# (Details, and every other endpoint such as env or heapdump, would leak internals to anyone.)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
